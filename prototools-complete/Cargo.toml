[package]
name        = "prototools-complete"
version.workspace    = true
edition     = "2021"
description = "Bash completion for clap from the raw command line, shared by the prototools CLIs"
license     = "MIT"
repository.workspace = true
keywords    = ["clap", "completion", "bash"]
categories  = ["command-line-interface"]

[dependencies]
clap          = { version = "4.5" }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
shlex         = "1.3"
workspace-hack = { version = "0.1", path = "../workspace-hack" }
