# fdp_scan – protobuf-scanner Python extension.
[package]
name    = "fdp_scan_lib"
version.workspace    = true
edition = "2021"

[lib]
name       = "fdp_scan_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The scanner (spec 0407 S1); this crate is its Python binding.
fdp-scan         = { workspace = true }
pyo3             = { version = "0.29", features = ["extension-module"] }
pyo3_stub_gen    = { version = "0.23", package = "pyo3-stub-gen" }
pyo3_stub_gen_derive = { version = "0.23", package = "pyo3-stub-gen-derive" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[[bin]]
name = "fdp_scan_post_build"
path = "src/bin/post_build.rs"

[build-dependencies]
pyo3-build-config = "0.29"
