# life — the GreHack 2026 workshop target: a game of life whose client
# draws the grid and whose server computes each generation, over cleartext
# gRPC (spec 0375).
#
# Deliberately NOT a member of the root workspace, like demo/bobapp (spec
# 0241 S1): cargo unifies features across a workspace, and tonic, hyper and
# tokio appear nowhere else in it.  Its own Cargo.lock.
#
#   cargo build --release --manifest-path grehack2026/game/Cargo.toml
#
# build.rs runs protoc (PROTOC, or protoc on PATH: the dev shell has it).

[package]
name        = "life"
version     = "0.1.0"
edition     = "2021"
description = "Game of life over cleartext gRPC, for the GreHack 2026 workshop"
license     = "MIT"
publish     = false

[dependencies]
clap         = { version = "4", features = ["derive"] }
# life-tap: kill(2), chown's user ids, getuid, localtime_r.
libc         = "0.2"
bytes        = "1"
# life-client reads the HTTP/2 error behind a failed step, to tell a
# connection renewal from a real fault (spec 0381 S1). It is downcast out of
# hyper's error chain, so it must stay the same h2 as hyper's (0.4): a
# different semver would be a different type, and the downcast would fail
# silently.
h2           = "0.4"
prost        = "0.14"
prost-types  = "0.14"
# life-server reads each request's tags through the prototext render (spec
# 0377). A path dependency, like bobapp's (spec 0241); life is out of the
# workspace, so this never touches the workspace graph.
prototext-core = { path = "../../prototext-core" }
ratatui      = "0.30"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tonic        = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
    "router",
    "server",
] }
tonic-prost  = "0.14"

[build-dependencies]
prost             = "0.14"
prost-types       = "0.14"
tonic-prost-build = "0.14"

[profile.release]
codegen-units   = 1
lto             = "thin"
overflow-checks = true

# tonic 0.14.6 panics ("`async fn` resumed after completion") when a
# connection reaches max_connection_age: its serve_connection select! loop
# re-polls the already-completed timeout future (grpc-rust issue #2522). The
# life-server sets max_connection_age (spec 0375 S4), so it hits this every
# few seconds. The fix — wrap the timeout future in Fuse — is merged
# upstream (PR #2780) but unreleased; 0.14.6 is still the latest crate. Pin
# that fixed commit, itself still version 0.14.6, until a release carries it.
# Remove this patch when tonic > 0.14.6 ships the fix.
[patch.crates-io]
tonic = { git = "https://github.com/grpc/grpc-rust", rev = "bf9526a70c5479ef9afa8f70f9764290a088a659" }
