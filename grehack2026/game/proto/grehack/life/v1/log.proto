// The server's traffic log (spec 0386): a protobuf of the messages the
// server saw. Compiled into the server for its own encoding, but its
// FileDescriptorProto is deliberately NOT embedded in the binary (spec 0386
// G4), and the client never links it (G3) — so the audience of step 3 holds
// a blob with no schema for this type.
//
// Every entry is a Capture (spec 0391): one per message on the wire, a
// request capture then a response capture each step. Each wraps the game's
// own message, so the log records real traffic (spec 0386 S4), and carries
// what that message hid, if anything.

syntax = "proto3";

package grehack.life.v1.log;

import "grehack/life/v1/life.proto";

// One logged message (spec 0391 S1–S2): `request` or `response` is set,
// never both.
message Capture {
  optional grehack.life.v1.StepRequest  request    = 1;    // as received
  optional grehack.life.v1.StepResponse response   = 2;    // as computed
  optional uint64                       generation = 3;    // the message's own
  optional string                       contraband = 666;  // what it hid
}

// The top-level log message (spec 0386 S2): captures appended in order.
message LogFile {
  repeated Capture capture = 42;
}
